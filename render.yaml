# Render Blueprint — ForgeWind API + user-service
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Set sync: false env vars in the dashboard after first deploy (DATABASE_URL, JWT_*, CORS_ORIGIN).

services:
  - type: web
    name: forgewind-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @forgewind-engine/config build &&
      pnpm --filter @forgewind-engine/utils build &&
      pnpm --filter @forgewind-engine/forgewind-api build
    startCommand: node apps/forgewind-api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: USER_SERVICE_URL
        sync: false

  - type: web
    name: user-service
    runtime: node
    plan: free
    region: virginia
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @forgewind-engine/config build &&
      pnpm --filter @forgewind-engine/utils build &&
      pnpm --filter @forgewind-engine/user-service exec prisma generate &&
      pnpm --filter @forgewind-engine/user-service build
    startCommand: node services/user-service/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
